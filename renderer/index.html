<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptForge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="banner">
      <div class="lockup">
        <img class="emblem" src="assets/logo.jpg" alt="" />
        <div class="names">
          <h1><span class="prompt">Prompt</span><span class="forge">Forge</span></h1>
          <div class="rule"></div>
        </div>
      </div>
    </header>

    <form id="form" class="ribbon">
      <label class="field prompt-field" for="prompt-input">
        <span>Word or prompt</span>
        <div class="prompt-shell">
          <textarea id="prompt-input" rows="3" placeholder="eyes, or paste a full prompt" spellcheck="false"></textarea>
          <div id="spell-layer" class="spell-layer" aria-hidden="true"></div>
        </div>
        <p class="spell-hint" id="spell-hint"></p>
      </label>

      <div class="field">
        <span id="model-label">Model</span>
        <div class="combo" id="model-combo">
          <button type="button" class="combo-button" id="model-button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="model-label">
            <span id="model-button-label">Pick a model</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div class="combo-panel" id="model-panel" hidden>
            <input id="model-search" type="text" placeholder="Search models" autocomplete="off" aria-label="Search models" />
            <div class="combo-list" id="model-list" role="listbox"></div>
          </div>
        </div>
      </div>

      <label class="field" for="format-select">
        <span>Format</span>
        <select id="format-select">
          <option value="auto">Auto from model</option>
          <option value="danbooru">Danbooru</option>
          <option value="gelbooru">Gelbooru</option>
          <option value="natural">Natural language</option>
        </select>
      </label>

      <div class="field generate-field">
        <span class="spacer">Go</span>
        <button type="submit" class="generate" id="generate">Generate</button>
      </div>

      <p class="error" id="form-error" hidden></p>
    </form>

    <div class="toggles">
      <label class="check"><input id="spell-toggle" type="checkbox" checked /> Fix spelling</label>
      <label class="check"><input id="improve-toggle" type="checkbox" checked /> Improve prompt</label>
      <label class="check"><input id="quality-toggle" type="checkbox" checked /> Quality tags</label>
      <label class="check"><input id="ultra-toggle" type="checkbox" /> Ultra detailed</label>
      <label class="check"><input id="negative-toggle" type="checkbox" /> Negative</label>
      <p class="hint" id="format-hint"></p>
      <p class="kbd">Ctrl+Enter generates. Ctrl+Shift+C characters, Ctrl+Shift+A camera, Ctrl+Shift+N negatives.</p>
    </div>

    <section class="stage">
      <div class="results-bar">
        <div>
          <h2>Results</h2>
          <p class="hint" id="results-meta">Type a word like eyes, or paste a prompt.</p>
          <p class="changes" id="change-notes" hidden></p>
        </div>
        <button type="button" class="copy-all" id="copy-all" hidden>Copy All</button>
      </div>
      <div id="results" class="results"></div>

      <div class="library">
        <div>
          <div class="history-head">
            <h2>Favorites</h2>
            <button type="button" class="text-btn" id="clear-favorites">Clear</button>
          </div>
          <div id="favorites-list" class="history-list"></div>
        </div>
        <div>
          <div class="history-head">
            <h2>History</h2>
            <div class="history-actions">
              <button type="button" class="text-btn" id="export-text">Export text</button>
              <button type="button" class="text-btn" id="export-json">Export JSON</button>
              <button type="button" class="text-btn" id="clear-history">Clear</button>
            </div>
          </div>
          <input id="history-search" type="search" placeholder="Search history" autocomplete="off" />
          <div id="history-list" class="history-list"></div>
        </div>
      </div>
    </section>

    <p class="credit">Decevr Co.</p>
    <p class="version" id="version" hidden></p>
  </div>

  <script src="data/models.js"></script>
  <script src="data/variations.js"></script>
  <script src="data/spelling.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script src="characters.js"></script>
  <script src="camera.js"></script>
  <script src="negatives.js"></script>
  <script src="variations.js"></script>
</body>
</html>
